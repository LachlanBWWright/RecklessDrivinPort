<mat-card class="border border-[var(--border)] bg-[var(--surface)]">
  <mat-card-content class="!px-4 !py-3">
    <app-editor-toolbar-actions
      [workerBusy]="workerBusy"
      [hasEditorData]="hasEditorData"
      [editorError]="editorError"
      [parsedLevels]="parsedLevels"
      [selectedLevelId]="selectedLevelId"
      (loadDefaultResources)="loadDefaultResources.emit()"
      (resourceFileSelected)="resourceFileSelected.emit($event)"
      (downloadEditedResources)="downloadEditedResources.emit()"
      (saveEditedResourcesToGame)="saveEditedResourcesToGame.emit()"
      (selectLevel)="selectLevel.emit($event)"
    />
  </mat-card-content>
</mat-card>
