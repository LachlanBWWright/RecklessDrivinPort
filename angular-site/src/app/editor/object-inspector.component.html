<div class="flex flex-col">
  <div class="border-b border-[var(--border)] bg-[var(--surface3)]">
    <div class="flex justify-center px-3 py-2.5">
      <span class="text-[0.98rem] font-bold text-[var(--on-surface)]">Inspector</span>
    </div>
    @if (selectedIndex !== null) {
      <div class="flex justify-center gap-3 pb-2">
        <button
          mat-icon-button
          class="!h-10 !min-h-10 !w-10 !min-w-10 !rounded-full !border !border-[var(--border)] !bg-[var(--surface2)] !p-0"
          (click)="deselect.emit()"
          aria-label="Deselect object"
        >
          <mat-icon>arrow_back</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          class="!h-10 !min-h-10 !w-10 !min-w-10 !rounded-full !border !border-[var(--border)] !bg-[var(--surface2)] !p-0"
          (click)="removeSelected.emit()"
          aria-label="Remove object"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }

    @if (selectedIndex !== null) {
      <app-editor-inspector-preview
        [selectedIndex]="selectedIndex"
        [typeDimLabel]="typeDimLabel"
        [spriteUrl]="spriteUrl"
      />

      <mat-divider class="!m-0 !border-[var(--border)]"></mat-divider>

      <form class="mt-3 flex flex-col gap-2 px-3 pb-2" [formGroup]="inspectorForm">
        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="w-full text-[0.85rem]"
        >
          <mat-label>Direction (°)</mat-label>
          <input
            matInput
            type="text"
            inputmode="decimal"
            formControlName="dirDegText"
            (focus)="dirDegFocused = true"
            (keydown.enter)="commitDirDegText(); $event.preventDefault()"
            (blur)="dirDegFocused = false; commitDirDegText()"
          />
          <span matSuffix class="inline-flex items-center justify-center pr-1">
            <app-editor-direction-indicator [rotation]="dirArrowRotation" />
          </span>
        </mat-form-field>

        <app-object-type-selector
          [form]="inspectorForm"
          [editTypeRes]="editTypeRes"
          [availableTypeIds]="availableTypeIds"
          [getSpriteUrl]="getSpriteUrl"
          [getFallbackColor]="getFallbackColor"
        />
      </form>

      <!-- Actions moved to top; keep the auto-apply note here -->
      <div class="flex items-center gap-2 px-[14px] pb-[14px] pt-2">
        <span class="text-[0.73rem] text-[var(--muted)]">Changes apply automatically</span>
      </div>
    } @else {
      <div
        class="flex min-h-[220px] flex-col items-center justify-center gap-2 px-4 py-8 text-center text-[0.85rem] italic leading-6 text-[var(--muted)]"
      >
        <p class="m-0 text-center text-[0.85rem] text-[var(--muted)]">No object selected</p>
      </div>
    }
  </div>
</div>
