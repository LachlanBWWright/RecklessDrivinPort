<mat-card
  class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
>
  <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
    @if (iconEntries.length > 0) {
      <div
        class="flex h-full min-h-0 flex-1 items-stretch gap-6 overflow-hidden max-[1100px]:flex-col"
      >
        <app-editor-screen-sidebar
          [entries]="iconEntries"
          [selectedId]="selectedIconId"
          [selectedType]="selectedIconType"
          [workerBusy]="workerBusy"
          [getIconThumbDataUrl]="getIconThumbDataUrl"
          (addEntry)="addIconEntry.emit()"
          (selectedChange)="selectIconEntry.emit($event)"
        />

        <app-editor-screen-selection-panel
          [selectedIconId]="selectedIconId"
          [selectedIconLabel]="selectedIconLabel"
          [selectedIconType]="selectedIconType"
          [iconPreviewDataUrl]="iconPreviewDataUrl"
          [workerBusy]="workerBusy"
          (openImageEditor)="openIconImageEditor.emit()"
          (exportPng)="exportIconPng.emit()"
          (exportRaw)="exportIconRaw.emit()"
          (pngUpload)="iconPngUpload.emit($event)"
          (rawUpload)="iconRawUpload.emit($event)"
        />
      </div>
    } @else {
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]"
          >image_not_supported</mat-icon
        >
        <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
          Screen and icon resources will appear here once a resources.dat is loaded.
        </p>
      </div>
    }
  </mat-card-content>
</mat-card>
