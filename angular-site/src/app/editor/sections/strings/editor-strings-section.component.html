<mat-card
  class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
>
  <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
    @if (strings !== null) {
      <app-editor-strings-body
        [strings]="strings"
        [busy]="busy"
        [dirty]="dirty"
        (stringChange)="stringChange.emit($event)"
        (addString)="addString.emit()"
        (removeString)="removeString.emit($event)"
        (save)="save.emit()"
      />
    } @else {
      <div class="flex flex-1 flex-col items-center justify-center gap-3 px-6 py-10 text-center">
        @if (busy) {
          <mat-spinner diameter="32"></mat-spinner>
          <p class="text-[0.85rem] text-[var(--muted)]">Loading string resources…</p>
        } @else {
          <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]">text_fields</mat-icon>
          <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
            String resources will appear here once a resources.dat is loaded.
          </p>
        }
      </div>
    }
  </mat-card-content>
</mat-card>
