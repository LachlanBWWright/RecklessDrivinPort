@if (selectedLevel) {
  <mat-card
    class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
  >
    <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
      <div
        class="flex min-h-0 w-full flex-1 items-stretch gap-4 overflow-hidden p-4 max-[1024px]:flex-col max-[1024px]:p-3"
      >
        <app-editor-objects-canvas-panel [state]="this" />

        <app-editor-objects-sidebar [state]="this" />
      </div>
    </mat-card-content>
  </mat-card>
}
