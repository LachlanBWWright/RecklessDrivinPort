<div
  class="flex w-full items-center gap-3 rounded-[10px] border border-transparent bg-[var(--surface2)] px-3 py-2.5 text-left transition duration-100 ease-out hover:-translate-y-px hover:border-white/10 hover:bg-[var(--surface3)]"
  [ngClass]="
    selectedTileId === tile.texId
      ? 'border-[color:rgba(66,165,245,0.55)] bg-[color:rgba(66,165,245,0.16)] shadow-[inset_0_0_0_1px_rgba(66,165,245,0.1)]'
      : ''
  "
>
  <button
    type="button"
    class="flex min-w-0 flex-1 items-center gap-2.5 border-0 bg-transparent p-0 text-left text-inherit"
    (click)="selected.emit(tile.texId)"
    [matTooltip]="'Tile #' + tile.texId + ' · ' + tile.width + '×' + tile.height + ' px'"
  >
    @if (getTileDataUrl(tile.texId); as url) {
      <img
        [src]="url"
        class="h-7 w-[54px] shrink-0 rounded-md border border-white/15 object-cover"
        [style.imageRendering]="'pixelated'"
        [alt]="'Tile ' + tile.texId"
      />
    } @else {
      <span
        class="h-7 w-[54px] shrink-0 rounded-md border border-white/15 bg-[linear-gradient(135deg,#555,#2c2c2c)]"
      ></span>
    }
    <span class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-[0.92rem]"
      >#{{ tile.texId }} · {{ tile.width }}×{{ tile.height }} px</span
    >
  </button>
  <span class="inline-flex items-center" [matTooltip]="getTileDeleteTooltip(tile.texId)">
    <button
      type="button"
      mat-icon-button
      color="warn"
      [disabled]="!canDeleteTileImage(tile.texId)"
      (click)="$event.stopPropagation(); deleted.emit(tile.texId)"
      [attr.aria-label]="'Delete tile ' + tile.texId"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </span>
</div>
