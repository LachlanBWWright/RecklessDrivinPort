<app-editor-sidebar>
  <div class="flex items-start justify-between gap-3 px-4 pt-4 pb-1">
    <div class="min-w-0 flex-1">
      <div
        class="text-base font-bold text-[var(--text)]"
        matTooltip="Pack 128 (kPackObTy) - reusable object definitions used by placed objects and object groups"
      >
        Object Type Editor
      </div>
      <div
        class="mt-2 text-[0.72rem] font-extrabold uppercase tracking-[0.12em] text-[var(--muted)]"
      >
        {{ objectTypes.length }} definitions
      </div>
    </div>
    <button
      mat-icon-button
      color="primary"
      (click)="addType.emit()"
      [disabled]="workerBusy"
      matTooltip="Create a new type"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <app-editor-sidebar-scroll class="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto px-4 pb-4">
    @for (type of objectTypes; track trackType($index, type)) {
      <button
        class="flex w-full items-center gap-3 rounded-[10px] border border-transparent bg-[var(--surface2)] px-3 py-2.5 text-left transition duration-100 ease-out hover:-translate-y-px hover:border-white/10 hover:bg-[var(--surface3)]"
        [ngClass]="
          selectedObjectTypeId === type.typeRes
            ? 'border-[color:rgba(66,165,245,0.55)] bg-[color:rgba(66,165,245,0.16)] shadow-[inset_0_0_0_1px_rgba(66,165,245,0.1)]'
            : ''
        "
        (click)="selectType.emit(type.typeRes)"
      >
        <span
          class="grid h-[52px] w-[52px] shrink-0 place-items-center overflow-hidden rounded-[10px] border border-white/10 bg-white/[0.04]"
        >
          <app-editor-object-entry-thumbnail
            [url]="getSpriteUrl(type.frame)"
            [fallbackText]="type.frame.toString()"
          />
        </span>
        <span class="flex min-w-0 flex-1 flex-col gap-0.5">
          <span class="text-[0.94rem] font-bold">Type #{{ type.typeRes }}</span>
          <span class="text-[0.76rem] text-[var(--muted)]">{{ getFrameLabel(type.frame) }}</span>
          <span class="text-[0.76rem] text-[var(--muted)]"
            >{{ type.width.toFixed(1) }}×{{ type.length.toFixed(1) }} m</span
          >
        </span>
        <mat-icon class="!h-[18px] !w-[18px] !text-[18px] shrink-0 text-[var(--muted)] opacity-85"
          >chevron_right</mat-icon
        >
      </button>
    }
  </app-editor-sidebar-scroll>
</app-editor-sidebar>
