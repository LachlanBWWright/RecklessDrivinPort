<div
  class="[scrollbar-width:thin] [scrollbar-color:var(--surface4)_var(--bg)] [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-[var(--bg)] [&::-webkit-scrollbar-thumb]:rounded [&::-webkit-scrollbar-thumb]:bg-[var(--surface4)] [&::-webkit-scrollbar-thumb:hover]:bg-[var(--muted)] flex min-h-0 min-w-0 flex-1 flex-col gap-[14px] overflow-y-auto px-4 py-4 pr-1 max-[1200px]:px-3 max-[1200px]:py-3"
>
  <div class="flex items-start justify-between gap-[18px] max-[1200px]:flex-col">
    <div>
      <h4 class="text-base font-bold text-[var(--on-surface)]">Type #{{ type.typeRes }}</h4>
      <p class="max-w-[760px] text-[0.85rem] text-[var(--muted)]">
        This definition controls the sprite frame, animation, collision, physics, scoring, and
        special gameplay flags.
      </p>
    </div>
    <div class="flex flex-wrap justify-end gap-2 max-[1200px]:justify-start">
      <button mat-raised-button color="primary" (click)="addType.emit()" [disabled]="workerBusy">
        <mat-icon>add</mat-icon> Add Type
      </button>
      <button
        mat-stroked-button
        color="warn"
        (click)="deleteType.emit(type.typeRes)"
        [disabled]="workerBusy"
      >
        <mat-icon>delete</mat-icon> Delete Type
      </button>
    </div>
  </div>

  <app-editor-object-type-preview
    [type]="type"
    [spriteUrl]="getSpriteUrl(getPreviewFrameId(type))"
    [frameLabel]="getFrameLabel"
    [previewFrame]="getPreviewFrameId(type)"
    [hasFrameControls]="hasPreviewFrameControls(type)"
    [workerBusy]="workerBusy"
    (frameStep)="frameStep.emit($event)"
  />

  <div class="flex min-h-0 flex-col gap-3" [formGroup]="typeForm">
    <app-editor-object-type-frame-select
      [form]="typeForm"
      [frames]="spriteFrames"
      [typeFrame]="type.frame"
      [getFrameLabel]="getFrameLabel"
    />

    <app-editor-object-type-core-fields [form]="typeForm" [tooltips]="fieldTooltips" />

    <app-editor-object-type-references
      [form]="typeForm"
      [type]="type"
      [objectTypes]="objectTypes"
      [audioEntries]="audioEntries"
      [fieldTooltips]="fieldTooltips"
      [getObjectTypeLabel]="getObjectTypeLabel"
      [getSoundLabel]="getSoundLabel"
    />

    <app-editor-object-type-scripting
      [typeRes]="type.typeRes"
      [scripts]="scripts"
      [scriptBindings]="scriptBindings"
      [scriptIssues]="scriptIssues"
      [workerBusy]="workerBusy"
      [flagOptions]="flagOptions"
      [flagForms]="flagForms"
      (scriptBindingChange)="scriptBindingChange.emit($event)"
      (createScript)="createScript.emit($event)"
      (openScript)="openScript.emit()"
    ></app-editor-object-type-scripting>
  </div>
</div>
