<mat-card
  class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
>
  <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
    @if (objectTypes.length > 0) {
      <div class="flex h-full min-h-0 flex-1 gap-6 overflow-hidden max-[1200px]:flex-col">
        <app-editor-object-types-list
          [objectTypes]="objectTypes"
          [selectedObjectTypeId]="selectedObjectTypeId"
          [workerBusy]="workerBusy"
          [getSpriteUrl]="getSpriteUrl"
          [getFrameLabel]="getFrameLabel"
          (addType)="addType.emit()"
          (selectType)="selectedObjectTypeIdChange.emit($event)"
        />

        @if (selectedType; as type) {
          <app-editor-object-type-detail
            [type]="type"
            [workerBusy]="workerBusy"
            [getSpriteUrl]="getSpriteUrl"
            [getPreviewFrameId]="getPreviewFrameId"
            [hasPreviewFrameControls]="hasPreviewFrameControls"
            [getFrameLabel]="getFrameLabel"
            [typeForm]="typeForm"
            [spriteFrames]="spriteFrames"
            [fieldTooltips]="fieldTooltips"
            [objectTypes]="objectTypes"
            [audioEntries]="audioEntries"
            [getObjectTypeLabel]="getObjectTypeLabel"
            [getSoundLabel]="getSoundLabel"
            [scripts]="scriptList"
            [scriptBindings]="scriptBindings ?? []"
            [scriptIssues]="scriptIssues ?? []"
            [flagOptions]="flagOptions"
            [flagForms]="flagForms"
            (addType)="addType.emit()"
            (deleteType)="deleteType.emit($event)"
            (frameStep)="stepPreviewFrame(type.typeRes, $event)"
            (scriptBindingChange)="scriptBindingChange.emit($event)"
            (createScript)="createAndOpenScriptEditor($event)"
            (openScript)="openSelectedScriptEditor()"
          />
        } @else {
          <app-editor-object-type-empty />
        }
      </div>
    } @else {
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]">category</mat-icon>
        <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
          Object type definitions from Pack 128 (kPackObTy) will appear here once a resources.dat is
          loaded.
        </p>
      </div>
    }
  </mat-card-content>
</mat-card>
