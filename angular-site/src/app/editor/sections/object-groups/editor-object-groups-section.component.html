<mat-card
  class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
>
  <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
    @if (objectGroups.length > 0) {
      <app-editor-object-groups-body
        [groupsHelpTooltip]="groupsHelpTooltip"
        [objectGroups]="objectGroups"
        [selectedGroup]="selectedGroup"
        [availableTypeIds]="availableTypeIds"
        [getObjTypeDimensionLabel]="getObjTypeDimensionLabel"
        [getSpriteUrl]="getSpriteUrl"
        [workerBusy]="workerBusy"
        [entryForms]="entryForms"
        [objectGroupClass]="objectGroupClass"
        [trackGroup]="trackGroup"
        [trackEntry]="trackEntry"
        (selectedObjectGroupIdChange)="selectedObjectGroupIdChange.emit($event)"
        (addGroup)="addGroup.emit()"
        (deleteGroup)="deleteGroup.emit($event)"
        (addEntry)="addEntry.emit($event)"
        (deleteGroupEntry)="deleteEntry.emit($event)"
      />
    } @else {
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]">inventory_2</mat-icon>
        <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
          Object group definitions from Pack 130 (kPackOgrp) will appear here once a resources.dat
          is loaded.
        </p>
      </div>
    }
  </mat-card-content>
</mat-card>
