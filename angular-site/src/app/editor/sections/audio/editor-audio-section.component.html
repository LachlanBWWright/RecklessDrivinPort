<mat-card
  class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
>
  <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
    @if (audioEntries.length > 0) {
      <div
        class="flex h-full min-h-0 flex-1 items-stretch gap-6 overflow-hidden max-[1100px]:flex-col"
      >
        <app-editor-audio-sidebar
          [audioEntries]="audioEntries"
          [workerBusy]="workerBusy"
          [audioEntryClass]="audioEntryClass"
          [audioEntryDetail]="audioEntryDetail"
          (addAudioEntry)="addAudioEntry.emit()"
          (selectAudioEntry)="selectAudioEntry.emit($event)"
        />

        <app-editor-audio-detail
          [selectedAudioId]="selectedAudioId"
          [selectedAudioBytes]="selectedAudioBytes"
          [selectedAudioSndInfo]="selectedAudioSndInfo"
          [audioVolumeControl]="audioVolumeControl"
          [audioSeekControl]="audioSeekControl"
          [audioPlayerVolume]="audioPlayerVolume"
          [audioDecodeInProgress]="audioDecodeInProgress"
          [audioControllable]="audioControllable"
          [audioPlaying]="audioPlaying"
          [audioCurrentTime]="audioCurrentTime"
          [audioDuration]="audioDuration"
          [workerBusy]="workerBusy"
          (togglePlayPause)="togglePlayPause.emit()"
          (exportAudioWav)="exportAudioWav.emit()"
          (audioWavUpload)="audioWavUpload.emit($event)"
        />
      </div>
    } @else {
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]">music_off</mat-icon>
        <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
          Sound entries from Pack 134 (kPackSnds) will appear here once a resources.dat is loaded.
        </p>
      </div>
    }
  </mat-card-content>
</mat-card>
