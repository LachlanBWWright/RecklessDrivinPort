@if (selectedPackSpriteFrame; as frame) {
  <div class="flex min-h-0 min-w-0 flex-1 flex-col gap-4 overflow-hidden px-4 py-4">
    <app-editor-sprite-details
      [frame]="frame"
      [workerBusy]="workerBusy"
      [getSpriteDataUrl]="getPackSpriteDataUrl"
      (openEditor)="openSpriteEditor.emit($event)"
      (pngUpload)="spritePngUpload.emit($event)"
      (exportPng)="exportSpritePng.emit()"
    />
  </div>
}
