<mat-card
  class="flex min-h-0 w-full flex-1 flex-col rounded-b-lg border border-[var(--border)] bg-[var(--surface)]"
>
  <mat-card-content class="!flex !min-h-0 !flex-1 !flex-col !p-0">
    @if (packSpriteFrames.length > 0) {
      <div
        class="flex h-full min-h-0 flex-1 items-stretch gap-6 overflow-hidden max-[1100px]:flex-col"
      >
        <app-editor-sprite-sidebar
          [frames]="packSpriteFrames"
          [selectedId]="selectedPackSpriteId"
          [workerBusy]="workerBusy"
          [getSpriteDataUrl]="getPackSpriteDataUrl"
          (addFrame)="addSpriteFrame.emit()"
          (selectedChange)="selectedPackSpriteIdChange.emit($event)"
        />

        <app-editor-sprite-selection-panel
          [selectedPackSpriteFrame]="selectedPackSpriteFrame"
          [workerBusy]="workerBusy"
          [getPackSpriteDataUrl]="getPackSpriteDataUrl"
          (openSpriteEditor)="openSpriteEditor.emit($event)"
          (spritePngUpload)="spritePngUpload.emit($event)"
          (exportSpritePng)="exportSpritePng.emit()"
        />
      </div>
    } @else {
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]"
          >image_not_supported</mat-icon
        >
        <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
          Game sprite frames from Pack 129/137 will appear here once decoded. Load a resources.dat
          to begin.
        </p>
      </div>
    }
  </mat-card-content>
</mat-card>
