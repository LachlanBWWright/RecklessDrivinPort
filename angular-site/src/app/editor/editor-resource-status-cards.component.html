@if (!hasData && !busy) {
  <mat-card class="w-full border border-dashed border-[var(--border)] bg-[var(--surface)]">
    <mat-card-content>
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-icon class="!h-14 !w-14 !text-[56px] text-[var(--surface4)]">folder_open</mat-icon>
        <h3 class="text-[1.2rem] font-bold text-[var(--on-surface)]">No data loaded</h3>
        <p class="max-w-[600px] leading-[1.6] text-[var(--muted)]">
          Load a <code>resources.dat</code> file to begin editing. The default file is served
          alongside the game.
        </p>
      </div>
    </mat-card-content>
  </mat-card>
}

@if (busy && !hasData) {
  <mat-card class="w-full border border-dashed border-[var(--border)] bg-[var(--surface)]">
    <mat-card-content>
      <div class="flex flex-col items-center gap-3 px-6 py-10 text-center">
        <mat-spinner diameter="40"></mat-spinner>
        <p class="max-w-[600px] leading-[1.6] text-[var(--on-surface)]">{{ status }}</p>
        <p class="text-[0.85rem] text-[var(--muted)]">
          Decompressing LZRW3-A level packs in background worker…
        </p>
      </div>
    </mat-card-content>
  </mat-card>
}
