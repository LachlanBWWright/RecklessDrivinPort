<div class="mt-3 rounded border border-[var(--border)] bg-[var(--surface2)] p-3">
  <p>Select exactly which levels to merge:</p>
  <div class="grid gap-1 sm:grid-cols-2">
    @for (levelResId of levelPackIds; track levelResId) {
      <mat-checkbox [checked]="isChecked(levelResId)" (change)="toggle(levelResId, $event.checked)"
        >Level {{ levelDisplayNum(levelResId) }} (Pack {{ levelResId }})</mat-checkbox
      >
    }
  </div>
</div>
