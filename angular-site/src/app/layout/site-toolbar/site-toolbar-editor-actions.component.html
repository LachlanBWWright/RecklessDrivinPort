<div class="flex min-w-0 flex-wrap items-center gap-2 px-4 py-2">
  <button
    mat-button
    class="!min-h-11 !whitespace-nowrap !rounded-none !border-b-4 !border-b-transparent !px-4 !text-[0.9rem] !font-semibold !tracking-[0.02em] hover:!text-[var(--on-surface)] [&_mat-icon]:!h-[18px] [&_mat-icon]:!w-[18px] [&_mat-icon]:!text-[18px]"
    style="color: var(--muted)"
    (click)="tabChange.emit()"
  >
    <mat-icon>arrow_back</mat-icon>
    <span>Back to Game</span>
  </button>

  <div class="flex min-w-0 flex-wrap items-center gap-2">
    <input
      #fileInput
      type="file"
      accept=".dat"
      (change)="resourceFileSelected.emit($event)"
      [disabled]="workerBusy || imageEditing"
      style="display: none"
    />
    <input
      #projectInput
      type="file"
      accept=".zip,.lua-project.zip"
      (change)="importLuaProject.emit($event)"
      [disabled]="workerBusy || imageEditing"
      style="display: none"
    />
    @if (!hasEditorData) {
      <button
        mat-stroked-button
        class="!border-[var(--border)] !bg-[var(--surface2)] !text-[var(--on-surface)] hover:!border-[var(--accent)] hover:!text-[var(--on-surface)] disabled:!border-[var(--border)] disabled:!bg-[var(--surface3)] disabled:!text-[var(--muted)]"
        (click)="loadDefaultResources.emit()"
        [disabled]="workerBusy || imageEditing"
      >
        <mat-icon>cloud_download</mat-icon> <span>Load Default</span>
      </button>
      <button
        mat-stroked-button
        type="button"
        class="!border-[var(--border)] !bg-[var(--surface2)] !text-[var(--on-surface)] hover:!border-[var(--accent)] hover:!text-[var(--on-surface)] disabled:!border-[var(--border)] disabled:!bg-[var(--surface3)] disabled:!text-[var(--muted)]"
        (click)="fileInput.click()"
        [disabled]="workerBusy || imageEditing"
      >
        <mat-icon>folder_open</mat-icon> <span>Upload resources.dat</span>
      </button>
    } @else {
      <button
        mat-stroked-button
        type="button"
        class="!h-11 !min-h-11 !border-[var(--border)] !bg-[var(--surface2)] !text-[var(--on-surface)]"
        [matMenuTriggerFor]="toolsMenu"
        [disabled]="workerBusy || imageEditing"
      >
        <mat-icon>build</mat-icon><span>Tools</span
        ><mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #toolsMenu="matMenu">
        <button mat-menu-item [disabled]="workerBusy || imageEditing" (click)="fileInput.click()">
          <mat-icon>merge_type</mat-icon><span>Merge resources.dat</span>
        </button>
        <mat-divider />
        <button
          mat-menu-item
          [disabled]="workerBusy || imageEditing"
          (click)="openLuaEditor.emit()"
        >
          <mat-icon>code</mat-icon><span>Lua editor</span>
        </button>
        <button
          mat-menu-item
          [disabled]="workerBusy || imageEditing"
          (click)="exportLuaProject.emit()"
        >
          <mat-icon>file_download</mat-icon><span>Export Lua project</span>
        </button>
        <button
          mat-menu-item
          [disabled]="workerBusy || imageEditing"
          (click)="projectInput.click()"
        >
          <mat-icon>file_upload</mat-icon><span>Import Lua project</span>
        </button>
        <mat-divider />
        <button
          mat-menu-item
          [disabled]="workerBusy || imageEditing"
          (click)="clearEditorFile.emit()"
          class="!text-[var(--danger)]"
        >
          <mat-icon class="!text-[var(--danger)]">delete_outline</mat-icon><span>Clear file</span>
        </button>
      </mat-menu>
      <button
        mat-stroked-button
        class="!h-11 !min-h-11 !border-[var(--accent2)] !text-[var(--accent2)] hover:!bg-[color:rgba(66,165,245,0.12)] disabled:!border-[var(--border)] disabled:!text-[var(--muted)]"
        (click)="previewSelectedLevel.emit()"
        [disabled]="workerBusy || imageEditing || selectedLevelId === null"
      >
        <mat-icon>play_arrow</mat-icon> <span>Preview</span>
      </button>
      <button
        mat-raised-button
        class="!h-11 !min-h-11 !bg-[var(--accent)] !text-white hover:!bg-[#d32f2f] disabled:!bg-[var(--surface3)] disabled:!text-[var(--muted)]"
        (click)="launchDownload.emit()"
        [disabled]="workerBusy || imageEditing"
      >
        <mat-icon>download</mat-icon> <span>Download</span>
      </button>
      @if (hasUndownloadedChanges) {
        <span
          role="status"
          class="inline-flex items-center gap-1.5 whitespace-nowrap px-1 text-xs font-normal text-[var(--muted)]"
          matTooltip="Download resources.dat to save a copy of your latest changes."
        >
          <span aria-hidden="true" class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>
          Unsaved changes
        </span>
      }
    }
  </div>

  <div
    class="ml-auto flex min-w-0 flex-wrap items-center justify-end gap-2 max-[980px]:ml-0 max-[980px]:justify-start"
  >
    <div
      class="flex items-center gap-2.5 text-[0.82rem]"
      [ngClass]="editorError ? 'text-[var(--danger)]' : ''"
    >
      @if (workerBusy) {
        <mat-spinner diameter="18" class="inline-block"></mat-spinner>
        <span class="text-[0.85rem] text-[var(--muted)]">Processing…</span>
      }
      @if (editorError) {
        <span class="flex items-center gap-1 text-[var(--danger)]">
          <mat-icon>warning</mat-icon> {{ editorError }}
        </span>
      }
    </div>

    @if (hasEditorData) {
      <div class="flex shrink-0 items-center gap-1">
        <app-site-toolbar-level-selector
          [selectedLevelId]="selectedLevelId"
          [parsedLevels]="parsedLevels"
          [workerBusy]="workerBusy || imageEditing"
          (selectLevel)="selectLevel.emit($event)"
        />
        <button
          mat-icon-button
          [matMenuTriggerFor]="levelMenu"
          aria-label="Manage levels"
          class="!text-[var(--muted)]"
          [disabled]="workerBusy || imageEditing || selectedLevelIndex < 0"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #levelMenu="matMenu">
          <button
            mat-menu-item
            [disabled]="workerBusy || parsedLevels.length >= 10"
            (click)="manageLevels.emit('new')"
          >
            <mat-icon>add</mat-icon><span>New level</span>
          </button>
          <button
            mat-menu-item
            [disabled]="workerBusy || parsedLevels.length >= 10"
            (click)="manageLevels.emit('duplicate')"
          >
            <mat-icon>content_copy</mat-icon><span>Duplicate level</span>
          </button>
          <button
            mat-menu-item
            [disabled]="workerBusy || parsedLevels.length < 2"
            (click)="rearrangeLevels()"
          >
            <mat-icon>reorder</mat-icon><span>Rearrange levels</span>
          </button>
          <button
            mat-menu-item
            [disabled]="workerBusy || parsedLevels.length <= 1"
            (click)="manageLevels.emit('delete')"
          >
            <mat-icon>delete_outline</mat-icon><span>Delete level</span>
          </button>
          <div class="px-4 py-2 text-xs text-[var(--muted)]">
            {{ parsedLevels.length }} of 10 levels
          </div>
        </mat-menu>
      </div>
    }
  </div>
</div>
