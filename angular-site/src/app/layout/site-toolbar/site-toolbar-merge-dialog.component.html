<h2 mat-dialog-title id="merge-dialog-title">Merge uploaded resources.dat</h2>
<mat-dialog-content>
  <p class="break-words text-sm text-[var(--muted)]">{{ pendingMergeFile?.name }}</p>
  <p>
    Choose which categories from the uploaded file should override the currently loaded editor data.
  </p>
  <app-site-toolbar-merge-options
    [options]="mergeOptions"
    (optionsChange)="optionsChange.emit($event)"
  />
  @if (mergeOptions.levels) {
    <app-site-toolbar-merge-levels
      [selectedLevelIds]="mergeOptions.levelResourceIds ?? []"
      (selectedLevelIdsChange)="levelIdsChange.emit($event)"
    />
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close.emit()">Cancel</button>
  <button mat-raised-button color="primary" (click)="confirm.emit()">Merge selected</button>
</mat-dialog-actions>
