<h2 mat-dialog-title id="download-dialog-title">Download resources.dat</h2>
<mat-dialog-content>
  <p>
    Download the current editor resources.dat. You can omit scripting resources for a file readable
    by the original game.
  </p>
  <mat-checkbox [checked]="stripScripts" (change)="stripScriptsChange.emit($event.checked)">
    Strip scripting resources
  </mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close.emit()">Cancel</button>
  <button mat-raised-button color="primary" (click)="confirm.emit()">Download</button>
</mat-dialog-actions>
