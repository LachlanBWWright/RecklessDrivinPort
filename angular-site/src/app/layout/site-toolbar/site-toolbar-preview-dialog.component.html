<h2 mat-dialog-title id="preview-dialog-title">Preview selected level</h2>
<mat-dialog-content>
  @if (selectedLevelId !== null) {
    <p class="text-sm text-[var(--muted)]">
      Level {{ levelDisplayNum(selectedLevelId) }} (Pack {{ selectedLevelId }})
    </p>
  }
  <p>
    This preview uses your current editor resources.dat state and restarts directly into this level.
  </p>
  <mat-checkbox [checked]="stripScripts" (change)="stripScriptsChange.emit($event.checked)">
    Strip scripting resources for this preview
  </mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close.emit()">Cancel</button>
  <button mat-raised-button color="primary" (click)="confirm.emit()">Start preview</button>
</mat-dialog-actions>
