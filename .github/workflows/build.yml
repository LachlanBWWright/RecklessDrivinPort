name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # Linux native build (SDL2)
  # ============================================================
  build-linux:
    name: Build on Linux (SDL2)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake gcc libsdl2-dev

      - name: Configure CMake (SDL2 backend, Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPORT_SDL2=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

      - name: Check binary exists
        run: |
          test -f build/reckless_drivin && echo "Build succeeded: $(file build/reckless_drivin)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-drivin-linux
          path: build/reckless_drivin
          if-no-files-found: error

  # ============================================================
  # macOS native build (SDL2 via Homebrew)
  # ============================================================
  build-macos:
    if: false
    name: Build on macOS (SDL2)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPORT_SDL2=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Check binary exists
        run: test -f build/reckless_drivin && echo "Build succeeded"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-drivin-macos
          path: build/reckless_drivin
          if-no-files-found: error

  # ============================================================
  # Windows native build (SDL2 via vcpkg)
  # ============================================================
  build-windows:
    if: false
    name: Build on Windows (SDL2)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDL2 via vcpkg
        run: |
          vcpkg install sdl2:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DPORT_SDL2=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Check binary exists
        run: Test-Path build\Release\reckless_drivin.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-drivin-windows
          path: build/Release/reckless_drivin.exe
          if-no-files-found: error

  # ============================================================
  # WebAssembly build using Emscripten
  # ============================================================
  build-wasm:
    name: Build WebAssembly (Emscripten)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js (for Angular build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: angular-site/pnpm-lock.yaml

      - name: Install Angular dependencies
        working-directory: angular-site
        run: pnpm install --frozen-lockfile

      - name: Build Angular site
        env:
          NG_CLI_ANALYTICS: "disable"
        run: |
          cd angular-site
          # ensure analytics prompt doesn't block in CI
          pnpm exec ng analytics disable || true
          pnpm run build --configuration=production
          echo "Angular build output:"
          ls -lh dist/reckless-drivin/browser/

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.3
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure CMake for WASM
        run: |
          emcmake cmake -B build_wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DPORT_SDL2=ON

      - name: Build WASM
        run: cmake --build build_wasm --parallel

      - name: List WASM outputs
        run: ls -lh build_wasm/

      - name: Prepare GitHub Pages content (Angular + WASM)
        run: |
          mkdir -p gh-pages
          # Copy WASM game files (they go at the repo root so the Angular
          # app can fetch them at /RecklessDrivinPort/reckless_drivin.js etc.)
          cp build_wasm/reckless_drivin.js   gh-pages/
          cp build_wasm/reckless_drivin.wasm gh-pages/
          cp build_wasm/reckless_drivin.data gh-pages/
          # Copy the default resource pack for the level editor and game loader.
          cp port/resources/resources.dat gh-pages/
          # Copy Angular pre-built static files (output directory from ng build)
          ANGULAR_DIST="angular-site/dist/reckless-drivin/browser"
          if [ -d "$ANGULAR_DIST" ]; then
            cp -r "$ANGULAR_DIST"/. gh-pages/
            echo "Deployed Angular site from $ANGULAR_DIST"
          else
            echo "::error::Angular build output not found at $ANGULAR_DIST"
            exit 1
          fi
          echo "Pages content:"
          ls -lh gh-pages/


      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-drivin-wasm
          path: gh-pages/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

  # ============================================================
  # Deploy to GitHub Pages (push to main/master only)
  # ============================================================
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-wasm
    runs-on: ubuntu-latest
    # only run on the default branch so we don't publish preview builds
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
