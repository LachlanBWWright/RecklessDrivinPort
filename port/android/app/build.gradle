apply plugin: 'com.android.application'

// SDL2_SOURCE_DIR can be passed as a Gradle property (-PSDL2_SOURCE_DIR=...)
// or via the SDL2_SOURCE_DIR environment variable.
def sdl2Dir = project.hasProperty('SDL2_SOURCE_DIR')
        ? project.SDL2_SOURCE_DIR
        : (System.getenv('SDL2_SOURCE_DIR') ?: '/tmp/SDL2')

android {
    namespace 'com.recklessdrivin'
    compileSdk 34

    // r28 builds 16 KB-aligned native libraries for newer Android devices.
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.recklessdrivin'
        minSdk 21
        targetSdk 34
        versionCode providers.gradleProperty('versionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('1.0-dev')

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DPORT_SDL2=ON",
                          "-DSDL2_SOURCE_DIR=${sdl2Dir}",
                          "-DANDROID=1"
                abiFilters 'arm64-v8a', 'x86_64'
                cFlags "-Wno-implicit-function-declaration " +
                       "-Wno-incompatible-pointer-types " +
                       "-Wno-int-conversion"
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Path relative to this build.gradle file:
            // port/android/app/ → ../../.. → repo root
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                // Java activity and native SDL must come from the same pinned source.
                "${sdl2Dir}/android-project/app/src/main/java"
            ]
            manifest.srcFile 'src/main/AndroidManifest.xml'
            res.srcDirs     = ['src/main/res']
            // Package the current pack directly; no stale copied asset can ship.
            assets.srcDirs  = ['../../../port/resources']
            assets.includes = ['resources.dat']
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}

if (providers.gradleProperty('requireReleaseSigning').getOrElse('false').toBoolean()) {
    ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].each { name ->
        if (!System.getenv(name)) {
            throw new GradleException("Release signing requires ${name}")
        }
    }
}
